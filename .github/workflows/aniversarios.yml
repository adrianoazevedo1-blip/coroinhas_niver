name: Aniversarios Coroinhas

on:
  schedule:
    - cron: '0 12 * * *'      # 09:00 de Brasília (o GitHub usa horário UTC)
  workflow_dispatch:
    inputs:
      listar_grupos:
        description: 'Listar os grupos (para achar o ID)? escreva 1'
        required: false
        default: ''
      teste_grupo:
        description: 'Testar nos GRUPOS? escreva 1'
        required: false
        default: ''
      teste_numero:
        description: 'Testar no PRIVADO (número, ex.: 5561999999999)'
        required: false
        default: ''

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node index.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EVOLUTION_URL: ${{ secrets.EVOLUTION_URL }}
          EVOLUTION_KEY: ${{ secrets.EVOLUTION_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          GRUPO_ID: ${{ vars.GRUPO_ID }}
          GRUPO_ID2: ${{ vars.GRUPO_ID2 }}
          MODO: ${{ vars.MODO }}
          ENVIAR_PARA: ${{ vars.ENVIAR_PARA }}
          MENSAGEM: ${{ vars.MENSAGEM }}
          LISTAR_GRUPOS: ${{ github.event.inputs.listar_grupos }}
          TESTE_GRUPO: ${{ github.event.inputs.teste_grupo }}
          TESTE_NUMERO: ${{ github.event.inputs.teste_numero }}
          TZ: America/Sao_Paulo
